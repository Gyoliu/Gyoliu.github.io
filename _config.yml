# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Gyo
subtitle: 'Gyo的博客'
description: 'Gyo的博客，记录学习、生活、工作中的点滴'
keywords: "blog gyo,Gyo,gyo,genesis,genesisx,Genesis,Genesisx,gyo博客,Gyo博客"
author: Gyo
language: en
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://gyoliu.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
#syntax_highlighter: highlight.js
syntax_highlighter: prismjs
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  line_threshold: 0
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 20
  order_by: -date

# Category & Tag
default_category: Default
# category_map：front matter 中的分类名 → 规范显示名（支持多分类）
# 键必须与文章中写的分类名完全一致；小写/遗留名称会自动映射为规范名
category_map:
  default: Default
  java: Java
  linux: Linux
  mysql: MySQL
  elasticsearch: Elasticsearch
  hexo: Hexo
  ai: AI
  默认分类: Default
  moments: 动态
# tag_map：front matter 中的标签名 → 规范显示名（支持多 tag）
tag_map:
  default: Default
  java: Java
  linux: Linux
  mysql: MySQL
  elasticsearch: Elasticsearch
  nginx: Nginx
  openssl: OpenSSL
  git: Git
  hibernate: Hibernate
  spring: Spring
  jvm: JVM
  selinux: SELinux
  paddlespeech: PaddleSpeech
  hacker: Hacker

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 20
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: hexo-theme-cosy

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: 'git'
  repository: git@github.com:Gyoliu/Gyoliu.github.io.git
  branch: main

# algolia 搜索
algolia:
  appId: QAG9U7ZTE8
  apiKey: 932b1f2436f03cbe4f1206f9226360f0
  adminApiKey: 
  # adminApiKey（写权限）不要提交到仓库，通过 GitHub Secret ALGOLIA_ADMIN_API_KEY 注入
  SearchOnlyAPIKey: 932b1f2436f03cbe4f1206f9226360f0
  chunkSize: 5000
  indexName: hexo
  fields:
    - content:strip:truncate,0,5000
    - excerpt:strip
    - categories
    - title
    - permalink
    - slug
    - tags
    - date

# RSS 
feed:
    limit: 0
    order_by: "-date"
    tag_dir: "tag"
    category_dir: "category"
    rss:
        enable: true
        # 使用包含 content:encoded 的模板，避免 Folo 将转义后的 HTML 当作普通文本展示。
        template: "themes/hexo-theme-cosy/layout/_alternate/rss.ejs"
        output: "rss.xml"
    atom:
        enable: true
        #template: "themes/theme/layout/_alternate/atom.ejs"
        output: "atom.xml"
    jsonFeed:
        enable: true
        #template: "themes/theme/layout/_alternate/json.ejs"
        output: "feed.json"
